<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>How was your stay? · DestinMe</title>
<link rel="icon" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a0c12;--panel:#24121a;--ink:#f3e7e9;--muted:#b89aa3;--gold:#d4ab63;--gold-2:#e6c584;--hair:rgba(212,171,99,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#2b1420,var(--bg) 60%);color:var(--ink);font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--hair);border-radius:18px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.brand{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold-2);letter-spacing:.5px;text-align:center}
.sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:2px}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;margin:22px 0 4px;text-align:center}
p{margin:0;color:var(--muted);font-size:13.5px;text-align:center;line-height:1.5}
.stars{display:flex;justify-content:center;gap:8px;margin:22px 0 6px}
.star{width:52px;height:52px;border-radius:14px;border:1px solid var(--hair);background:rgba(255,255,255,.03);font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s,background .12s;color:#8a6a72}
.star.on{background:rgba(212,171,99,.18);color:var(--gold-2);border-color:var(--gold);transform:scale(1.06)}
.lbl{text-align:center;font-size:12.5px;color:var(--gold-2);min-height:18px;margin-bottom:12px}
.row{display:flex;gap:8px;margin:12px 0}
.opt{flex:1;padding:11px;border-radius:12px;border:1px solid var(--hair);background:rgba(255,255,255,.03);color:var(--ink);font:inherit;font-size:13.5px;cursor:pointer}
.opt.on{background:rgba(212,171,99,.18);border-color:var(--gold)}
textarea{width:100%;background:#1c0d14;color:var(--ink);border:1px solid var(--hair);border-radius:12px;padding:11px;font:inherit;font-size:13.5px;min-height:84px;resize:vertical}
.btn{width:100%;margin-top:14px;padding:13px;border-radius:12px;border:0;background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#241019;font:inherit;font-weight:600;font-size:14.5px;cursor:pointer}
.btn:disabled{opacity:.5}
.done{text-align:center;padding:14px 0}
.done .big{font-size:44px}
.foot{margin-top:18px;text-align:center;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="card" id="app">
  <div class="brand">DestinMe</div><div class="sub">Stay · Discover · Repeat</div>
  <div id="body"><p style="margin-top:24px">One moment…</p></div>
</div>
<script>
const U='https://pmsjeivlvxxkkibwlvuu.supabase.co',K='sb_publishable__3MgDWLyLC7Mm4uHmr-MKw_DSI9OQAg';
const tok=new URLSearchParams(location.search).get('t');
const rpc=(fn,a)=>fetch(U+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(a)}).then(r=>r.json());
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LBL=['','Not good','Could be better','It was fine','Really good','Loved it'];
let rating=0,back=null;
function thanks(){document.getElementById('body').innerHTML=`<div class="done"><div class="big">🙏</div><h1>Thank you</h1><p>That helps us look after the next guest better.<br>We hope to see you again.</p></div>`;}
async function load(){
  if(!tok){document.getElementById('body').innerHTML='<p style="margin-top:24px">This link is missing its code.</p>';return;}
  const c=await rpc('fn_guest_feedback_context',{p_token:tok}).catch(()=>null);
  if(!c||!c.ok){document.getElementById('body').innerHTML='<p style="margin-top:24px">This link is not valid any more.</p>';return;}
  if(c.done){thanks();return;}
  document.getElementById('body').innerHTML=`
    <h1>How was your stay${c.guest?', '+esc(c.guest):''}?</h1>
    <p>${c.property?esc(c.property):'Your DestinMe stay'}${c.checkout?' · checked out '+esc(c.checkout):''}</p>
    <div class="stars">${[1,2,3,4,5].map(n=>`<div class="star" data-n="${n}" onclick="pick(${n})">★</div>`).join('')}</div>
    <div class="lbl" id="lbl"></div>
    <p>Would you come back?</p>
    <div class="row"><button class="opt" id="yes" onclick="ret(true)">Yes</button><button class="opt" id="no" onclick="ret(false)">Not sure</button></div>
    <textarea id="cm" placeholder="Anything we should know — what was great, what wasn't (optional)"></textarea>
    <button class="btn" id="send" disabled onclick="send()">Send</button>
    <div class="foot">Takes 10 seconds. Only the DestinMe team sees this.</div>`;
}
function pick(n){rating=n;document.querySelectorAll('.star').forEach(s=>s.classList.toggle('on',+s.dataset.n<=n));document.getElementById('lbl').textContent=LBL[n];document.getElementById('send').disabled=false;}
function ret(v){back=v;document.getElementById('yes').classList.toggle('on',v===true);document.getElementById('no').classList.toggle('on',v===false);}
async function send(){const b=document.getElementById('send');b.disabled=true;b.textContent='Sending…';
  const r=await rpc('fn_guest_feedback_submit',{p_token:tok,p_rating:rating,p_would_return:back,p_comment:document.getElementById('cm').value.trim()||null}).catch(()=>null);
  if(!r||!r.ok){b.disabled=false;b.textContent='Send';alert((r&&r.error)||'Could not send — please try again');return;}
  thanks();}
load();
</script>
</body>
</html>
